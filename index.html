<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airsoft PG — Campos de Airsoft em Ponta Grossa</title>
  <meta name="description" content="Encontre os campos de airsoft de Ponta Grossa. Conheça a Legião Airsoft PG." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="tactical-photo-bg" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-badge">PG</span>
      <span class="brand-name">Airsoft<span>PG</span></span>
    </a>
  </header>

  <main>
    <section class="fields" id="campos">
      <div class="section-title">
        <span class="bar"></span>
        <h2>Campos</h2>
      </div>

      <div class="fields-grid">

        <a class="field-card" href="legiao-pg.html">
          <div class="field-bg" style="background-image: url('images/legiaopg.jpeg')"></div>
          <div class="card-overlay"></div>
          <div class="card-content">
            <span class="field-status">● Ativo</span>
            <h3 class="field-name">Legião Airsoft Pg</h3>
            <p class="field-location">Ponta Grossa — PR</p>
            <span class="field-cta">
              Ver campo
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </span>
          </div>
        </a>

        <a class="field-card add-more" href="#campos">
          <div class="card-content">
            <span class="plus">+</span>
            <p>Novos campos em breve</p>
          </div>
        </a>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>Airsoft<span>PG</span> · airsoftpg.com.br</p>
  </footer>
</body>
</html>
